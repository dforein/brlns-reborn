      message2: '&l&ePlaying %s'  #replace name
      other-messages:
      colors:
      - 'e'
      - 'a'
      - '9'
  friend-server-join: '&3%s &ais now online'
  friend-minigame-join: '&3%s &ais now playing %s'
  friend-server-left: '&3%s &ais no longer online'

match:
  waiting-lobby:
    action-bar:
      on-join: '&3%s &7joined (&a%d&7/&a%d&7)'
      on-leave: '&3%s &7left (&a%d&7/&a%d&7)'
    voting:
      map-vote: '&aYou voted on the map: &e%s'
      time-vote: '&aYou voted on the time of day: &e%s'
      weather-vote: '&aYou voted on the weather: &e%s'
