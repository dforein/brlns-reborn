  rules-book:
    item-name: '&o&l&fRules &r&7- Hold / Right Click'
    title: Murder Mystery Rules
    author: Server
    content:
    - |-
      §l§aMurder§2Mystery

      §r§7Find and eliminate the murderer before they kill everyone!

      §7Collect §6GOLD §7to craft a gun.
    - |-
      §l§6Roles:

      §r§cMurderer§7: Kill all innocents

      §9Sheriff§7: Protect innocents

      §aInnocent§7: Survive and collect gold
    - |-
      §l§dTips:

      §r§7- Watch for suspicious behavior
      §7- Work together
      §7- The murderer has a throwable sword and can turn the lights off for a short period
