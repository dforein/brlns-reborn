#config.yml

game:
  min-players: 2
  max-players: 20
  min-players-start: 6
  max-countdown: 45
  shortened-countdown: 10
  pregame-countdown: 10
  game-duration: 420
  end-time: 10

lobby:
  spawn:
    x: 0
    y: 81
    z: 0
    world: "lobby"
  rules-book:
    item-name: "&o&l&fRules &r&7- Hold / Right Click"
    title: "Murder Mystery Rules"
    author: "Server"
    pages:
      - "§l§aMurder§2Mystery\n\n§r§7Find and eliminate the murderer before they kill everyone!\n\n§7Collect §6GOLD §7to craft a gun."
      - "§l§6Roles:\n\n§r§cMurderer§7: Kill all innocents\n\n§9Sheriff§7: Protect innocents\n\n§aInnocent§7: Survive and collect gold"
      - "§l§dTips:\n\n§r§7- Watch for suspicious behavior\n§7- Work together\n§7- The murderer has a throwable sword and can turn the lights off for a short period"
  game-poll:
    item-name: "&o&l&dGame Poll &r&7- Hold / Right Click"
    times:
      - "Day"
      - "Sunrise"
      - "Sunset"
      - "Night"

murderer:
  sword-throw-cooldown: 10
  sword-throw-speed: 6
  blindness-duration: 20
  time-start-tracking: 60
  sword-name: "&o&l&cMurderstick"
  blaze-rod-name: "&o&l&6Lights Out"

sheriff:
  shoot-cooldown: 0.2
  friendly-fire-death: true
  raycast-max-distance: 100
  raycast-step: 0.2
  hoe-name: "§o§l§9Sheriff Hoe"

innocents:
  gold-for-gun: 5
  dye-name: "&o&l&eCraft The Gun &r&7( Hold / Right Click )"

spectator:
  item-name: "&o&l&7Teleport to Player"

death:
  animation-duration: 0.4167
  head-yaw-offset: -35
  head-pitch-offset: -40
  redstone-drop: 2
  blindness-duration: 2

gold:
  spawn-interval-min: 2
  spawn-interval-max: 3

exp:
  per-gold: 10
  per-kill: 15
  sheriff-won: 600
  sheriff-kill: 100

scoreboard:
  title: "&l§aMurder§2Mystery"
  update-interval: 10

